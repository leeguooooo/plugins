name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/install-use-family.test.sh
      - run: sh tests/readme-codex-list.test.sh
      - name: install-use-family.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install-use-family.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
